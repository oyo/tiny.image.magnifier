<body style="background-color:#202020; padding:200px;">
  <script type="module">
    import { setLens, magnify } from './lib.js'
    setLens({
      radius: 250,
      light: 20,
      zoom: 3,
      distortFactor: -0.002
    })
    const img = new Image()
    img.setAttribute('crossOrigin', 'anonymous')
    img.src = 'frog.jpg'
    document.body.appendChild(img)
    magnify(img)
  </script>
</body>
