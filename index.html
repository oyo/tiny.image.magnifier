<!doctype html>
<html>

<head>
  <title>tiny.image.magnifier</title>
  <style>
    body {
      background: #f8f4f0;
      color: gray;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }

    .magnify {
      border: 1px solid #cccccc;
      background: white;
      margin: 30px;
    }
  </style>
</head>

<body>
  <img class="magnify" crossOrigin="anonymous"
    src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" />
  <canvas class="magnify" id="render" width="100" height="100"></canvas>
  <ul>
    <li>hover : show magnify view</li>
    <li>click : switch between normal/lens mode</li>
    <li>scroll : set zoom level</li>
    <li>[shift] + scroll : set lens size</li>
    <li>[ctrl] + scroll : set lens light intensity</li>
    <li>[alt] + scroll : set distortion level (in lens mode)</li>
  </ul>
  <script>
    const can = document.getElementById('render'),
      ctx = can.getContext('2d', { willReadFrequently: true }),
      w = can.width,
      h = can.height,
      w2 = w >> 1,
      h2 = h >> 1
    ctx.strokeStyle = 'white'
    ctx.fillStyle = '#040'
    ctx.fillRect(0, 0, w, h)
    ctx.strokeRect(0, 0, w, h)
    ctx.strokeStyle = 'white'
    ctx.lineWidth = 0.2
    for (var x = 20; x < w2; x += 20) {
      ctx.beginPath()
      ctx.moveTo(w2 - x, 0)
      ctx.lineTo(w2 - x, h)
      ctx.stroke()
      ctx.beginPath()
      ctx.moveTo(w2 + x, 0)
      ctx.lineTo(w2 + x, h)
      ctx.stroke()
    }
    for (var y = 20; y < h2; y += 20) {
      ctx.beginPath()
      ctx.moveTo(0, h2 - y)
      ctx.lineTo(w, h2 - y)
      ctx.stroke()
      ctx.beginPath()
      ctx.moveTo(0, h2 + y)
      ctx.lineTo(w, h2 + y)
      ctx.stroke()
    }
    ctx.lineWidth = 0.8
    ctx.beginPath()
    ctx.moveTo(w2, 0)
    ctx.lineTo(w2, h)
    ctx.stroke()
    ctx.beginPath()
    ctx.moveTo(0, h2)
    ctx.lineTo(w, h2)
    ctx.stroke()
    ctx.strokeStyle = '#48a'
    ctx.lineWidth = 2
    ctx.beginPath()
    for (var a = 0; a < 360; a++) {
      var p = Math.PI * a / 180,
        r = h2 * (0.5 + 0.25 * Math.cos(5 * p)),
        x = r * Math.cos(p),
        y = r * Math.sin(p)
      ctx.lineTo(x + w2, y + h2)
    }
    ctx.stroke()
    ctx.fillStyle = '#0cf'
    ctx.fill()
    ctx.strokeStyle = '#444'
    ctx.beginPath()
    ctx.arc(w2, h2, h / 8, 0, 2 * Math.PI)
    ctx.stroke()
    ctx.fillStyle = '#fb4'
    ctx.fill()
  </script>
  <script type="module" src="dist/index.js"></script>
</body>

</html>
